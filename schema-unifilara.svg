<text x="85" y="725" font-size="17">N ieșire Growatt</text>
<text x="425" y="705" font-size="18" font-weight="700" text-anchor="middle">C2</text>
<text x="425" y="799" font-size="17" text-anchor="middle">Schneider · DO3</text>
<text x="675" y="766" font-size="18">PE</text>
<text x="830" y="729" font-size="17">Legătură declarată în regim autonom.</text>
<text x="830" y="758" font-size="17">Situată înaintea diferențialelor casei.</text>
<text x="830" y="787" font-size="16">Racordul exact față de C3/C4: de documentat prin bornare.</text>
<text x="85" y="851" font-size="16">PE rămâne conductor de protecție; nu este reprezentat ca pol de transfer. Simbolurile contactelor nu indică starea actuală.</text>
<text x="85" y="894" font-size="18" font-weight="700">C. COMANDĂ FRONTALĂ</text>
<text x="85" y="927" font-size="17">Buton frontal → DI2 / WaveShare → DO2 → C3 (comanda ieșirii Growatt).</text>
<text x="85" y="1001" font-size="15">* Interblocaj conform descrierii realizatorului; fără verificare funcțională AAR în acest studiu.</text>
<text x="85" y="1026" font-size="15">Fără borne, calibre, secțiuni sau toate legăturile PE. Nu este plan de cablare / declarație de conformitate.</text>
