<text x="85" y="238" font-weight="700">IEȘIRE AC DEYE</text>
<text x="85" y="322">L / N</text>
<text x="455" y="219" font-weight="700" text-anchor="middle">C1</text>
<text x="455" y="322" text-anchor="middle">Schrack · 2 poli</text>
<text x="455" y="347" text-anchor="middle">Comandă DO1</text>
<text x="737" y="250" font-size="20" font-weight="700" text-anchor="middle">GROWATT UPS</text>
<text x="737" y="281" text-anchor="middle">AC IN / AC OUT</text>
<path d="M656 310H819" stroke="#111" stroke-width="1"/>
<text x="737" y="337" text-anchor="middle">Invertor + stocare</text>
<text x="1073" y="219" font-weight="700" text-anchor="middle">C3</text>
<text x="1183" y="325">2 poli · DO2</text>
<text x="1183" y="350">Ieșire Growatt</text>
<text x="1073" y="470" font-weight="700" text-anchor="middle">C4</text>
<text x="1183" y="565">2 poli · AAR</text>
<text x="1183" y="590">Bypass</text>
<text x="1330" y="215">CĂTRE DIFERENȚIALE</text>
<text x="1330" y="239">ȘI CONSUMATORI</text>
<text x="370" y="488">Derivație bypass în amonte de C1</text>
<text x="1110" y="402" font-size="16">Interblocaj mecanic</text>
<text x="1110" y="426" font-size="16">și electric C3–C4*</text>
<text x="370" y="565" font-size="16">Alimentare comună; bypass-ul ocolește C1 și Growatt.</text>
