<path d="M75 630H1600" stroke="#111" stroke-width="1"/>
<text x="85" y="673" font-size="18" font-weight="700">B. LEGĂTURĂ N–PE — DETALIU FUNCȚIONAL SEPARAT</text>
<g stroke="#111" fill="none" stroke-width="2.3">
<path d="M135 760H400 M400 760L452 725 M452 760H640V786 M615 786H665 M622 795H658 M630 804H650"/>
