<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1188" viewBox="0 0 1680 1188" role="img" aria-labelledby="t d">
<title id="t">Growatt UPS - schemă unifilară funcțională, revizia 1.1</title>
<desc id="d">Desen monocrom. Ieșirea DEYE se ramifică înainte de C1: calea C1-Growatt-C3 și calea C4 bypass. C3 și C4 sunt interblocate. C1, C3 și C4 comută L și N. Detaliul separat N-PE prin C2 este înainte de diferențiale. DI2 comandă DO2-C3. Nu este plan de execuție certificat.</desc>
<rect width="1680" height="1188" fill="white"/>
<g stroke="#111" fill="none" stroke-width="1.5">
<rect x="30" y="30" width="1620" height="1128"/><rect x="48" y="48" width="1584" height="1092"/>
<path d="M48 100H1632 M48 972H1632 M48 1040H1632 M1030 972V1140 M1030 1055H1632 M1030 1098H1632 M1290 1055V1140 M1470 1055V1140"/>
</g>
<g font-family="Arial,sans-serif" fill="#111">
<text x="75" y="80" font-size="24" font-weight="700">GROWATT UPS — SCHEMĂ UNIFILARĂ FUNCȚIONALĂ</text>
<text x="1560" y="80" font-size="17" text-anchor="end">Foaia 1 / 1</text>
<text x="85" y="144" font-size="18" font-weight="700">A. CIRCUITE DE ALIMENTARE ȘI TRANSFER</text>
<text x="85" y="176" font-size="15">L + N reprezentate unifilar; C1, C3 și C4 comută ambele conductoare.</text>
